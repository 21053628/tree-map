<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樹木資訊</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';">
<style>
  body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f1f5f1;color:#222;
       -webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:14px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#666;font-size:13px}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:12px}
  img.tree{width:100%;border-radius:10px;margin-top:8px}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:#2e7d32;color:#fff;font-size:16px;margin-top:8px;cursor:pointer;touch-action:manipulation}
  button.sec{background:#546e7a}
  a.back{display:inline-block;background:#37474f;color:#fff;text-decoration:none;
         padding:8px 14px;border-radius:8px;margin-bottom:10px;font-size:14px}
  select,textarea,input{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px;margin-top:8px;box-sizing:border-box}
  .log{font-size:13px;color:#444;border-top:1px dashed #ccc;padding:6px 0}
  .ok{color:#2e7d32;font-weight:bold}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .grid div{background:#f8fafc;padding:8px;border-radius:6px;text-align:center;font-size:13px}
  .grid b{display:block;color:#2e7d32;font-size:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  hr{border:none;border-top:1px dashed #ccc;margin:12px 0}
  #minimap{height:180px;border-radius:10px;margin-top:8px}
  @media (max-width:600px){
    .wrap{padding:10px}
    .card{padding:12px}
    #minimap{height:160px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">載入中…</div></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>if(!window.L){document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');}</script>
<script>if(!window.L){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>');}</script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js"></script>
<script>if(!window.proj4){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"><\/script>');}</script>

<script>
const API = 'https://script.google.com/macros/s/AKfycby5Wby6nj8MPOdw5io10CakB877gY8qf3HKeckPz5MVb-to8QxUYfEH3pN_y-6hHvXj/exec';
const STAFF_PASS = 'tree2026';
const $ = function(s){ return document.querySelector(s); };

const HK80  = '+proj=tmerc +lat_0=22.31213333333334 +lon_0=114.1785555555556 +k=1 +x_0=836694.05 +y_0=819069.8 +ellps=intl +towgs84=-162.619,-276.959,-161.764,0.067753,-2.243649,-1.158827,-1.094246 +units=m +no_defs';
const WGS84 = '+proj=longlat +datum=WGS84 +no_defs';
function toHK(lat,lng){
  if(!window.proj4 || !lat || !lng) return null;
  try{ const r = proj4(WGS84, HK80, [+lng, +lat]); return {N:r[1], E:r[0]}; }catch(e){ return null; }
}
function toWGS(N,E){
  if(!window.proj4) return null;
  try{ const r = proj4(HK80, WGS84, [+E, +N]); return {lat:r[1], lng:r[0]}; }catch(e){ return null; }
}
function f2(n){ return Number(n).toFixed(2); }

const params = new URLSearchParams(location.search);
const id  = params.get('id') || 'A001';
const prj = params.get('prj') || '';
let TREE = null;

function staffOk(){
  const until = +localStorage.getItem('tree_staff_until') || 0;
  if(Date.now() < until) return true;
  const p = prompt('請輸入工作人員密碼：');
  if(p === STAFF_PASS){
    localStorage.setItem('tree_staff_until', Date.now() + 30*60*1000);
    return true;
  }
  alert('密碼錯誤'); return false;
}

function fmtTime(v){
  const d = new Date(v);
  if(isNaN(d.getTime())) return String(v).slice(0,16);
  const p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

fetch(API + '?action=tree&id=' + encodeURIComponent(id) + '&prj=' + encodeURIComponent(prj))
  .then(function(r){ return r.json(); })
  .then(function(res){
    const t = res.data;
    if(!t){ $('#app').innerHTML = '<div class="card">找不到樹木：' + id + '</div>'; return; }
    TREE = t; render(t); initMiniMap(t); loadLogs();
  })
  .catch(function(err){
    $('#app').innerHTML = '<div class="card">❌ 後端連線失敗：' + err.message + '</div>';
  });

const COLORS = {'Normal':'#2e7d32','Fair':'#f9a825','Poor':'#ef6c00','Very Poor':'#c62828','Dead':'#424242'};

function render(t){
  const hasPhoto = t.photo_url && String(t.photo_url).indexOf('...') === -1;
  const hk = toHK(t.lat, t.lng);
  $('#app').innerHTML =
  '<a class="back" href="index.html">⬅ 地圖</a>' +
  '<div class="card">' +
    '<h1>' + t.tree_id + ' ' + t.name + '</h1>' +
    '<div class="sub"><i>' + t.species + '</i></div>' +
    '<div style="margin-top:8px"><span class="badge" style="background:' + (COLORS[t.status]||'#757575') + '">Status: ' + t.status + '</span></div>' +
    (hasPhoto ? '<img class="tree" src="' + t.photo_url + '">' : '') +
    '<div class="grid">' +
      '<div>Height<b>' + (t.height||'-') + ' m</b></div>' +
      '<div>Spread<b>' + (t.spread||'-') + ' m</b></div>' +
      '<div>DBH<b>' + (t.dbh||'-') + ' cm</b></div>' +
    '</div>' +
    '<div class="sub" style="margin-top:8px">' + (t.description||'') + '</div>' +
    '<div class="sub" style="margin-top:6px">📍 <b>HK80：</b>N ' + (hk?f2(hk.N):'—') + ' ／ E ' + (hk?f2(hk.E):'—') + ' ｜ <b>Level：</b>' + (t.level||'-') + ' m</div>' +
    '<div class="sub">WGS84：' + t.lat + ', ' + t.lng + '</div>' +
    '<div id="minimap"></div>' +
  '</div>' +
  '<div class="card" id="staffBox"><button class="sec" onclick="staffMode()">🔑 工作人員</button></div>' +
  '<div class="card"><b>📋 巡查歷史</b><div id="logs"><div class="log">載入中…</div></div></div>';
}

function initMiniMap(t){
  if(!window.L) return;
  const lat=+t.lat, lng=+t.lng;
  if(!lat||!lng) return;
  const mm = L.map('minimap',{zoomControl:false, attributionControl:false,
                 dragging:false, scrollWheelZoom:false, doubleClickZoom:false})
               .setView([lat,lng], 18);
  L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png',{maxZoom:19}).addTo(mm);
  L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/wgs84/{z}/{x}/{y}.png',{maxZoom:19}).addTo(mm);
  L.circleMarker([lat,lng],{color:'#fff',weight:2,radius:9,
    fillColor:COLORS[t.status]||'#757575',fillOpacity:.9}).addTo(mm);
}

function staffMode(){
  if(!staffOk()) return;
  const hk = toHK(TREE.lat, TREE.lng);
  $('#staffBox').innerHTML =
    '<button onclick="checkin()">✅ 簽到</button>' +
    '<hr><b>巡查記錄（狀態會自動同步樹木資料）</b>' +
    '<select id="health"><option>Normal</option><option>Fair</option><option>Poor</option><option>Very Poor</option><option>Dead</option></select>' +
    '<textarea id="note" rows="2" placeholder="備註"></textarea>' +
    '<input type="file" id="photo" accept="image/*" capture="environment">' +
    '<button onclick="submitInspection()">📤 上傳巡查記錄</button>' +
    '<hr><b>✏️ 樹木資料（HK80 座標／Level／地盤）</b>' +
    '<div class="row2"><input id="eName" placeholder="名稱"><input id="eSpecies" placeholder="樹種"></div>' +
    '<select id="eStatus"><option>Normal</option><option>Fair</option><option>Poor</option><option>Very Poor</option><option>Dead</option></select>' +
    '<select id="eProject"></select>' +
    '<div class="row2"><input id="eHeight" placeholder="Height (m)" inputmode="decimal"><input id="eSpread" placeholder="Spread (m)" inputmode="decimal"></div>' +
    '<input id="eDbh" placeholder="DBH (cm)" inputmode="decimal">' +
    '<div class="row2"><input id="eN" placeholder="HK80 N (Northing)" inputmode="decimal"><input id="eE" placeholder="HK80 E (Easting)" inputmode="decimal"></div>' +
    '<input id="eLevel" placeholder="Level (m，高程)" inputmode="decimal">' +
    '<textarea id="eDesc" rows="2" placeholder="簡介"></textarea>' +
    '<button onclick="saveTreeInfo()">💾 儲存樹木資料</button>';

  $('#eName').value = TREE.name || '';
  $('#eSpecies').value = TREE.species || '';
  $('#eStatus').value = TREE.status || 'Normal';
  $('#eHeight').value = TREE.height || '';
  $('#eSpread').value = TREE.spread || '';
  $('#eDbh').value = TREE.dbh || '';
  $('#eN').value = hk ? f2(hk.N) : '';
  $('#eE').value = hk ? f2(hk.E) : '';
  $('#eLevel').value = TREE.level || '';
  $('#eDesc').value = TREE.description || '';

  fetch(API + '?action=projects').then(function(r){ return r.json(); }).then(function(res){
    const opts = (res.data || []).map(function(p){
      return '<option value="' + p.project_id + '">🚩 ' + p.name + '</option>';
    }).join('');
    $('#eProject').innerHTML = '<option value="">（不屬任何地盤）</option>' + opts;
    $('#eProject').value = TREE.project_id || '';
  });
}

async function checkin(){
  const staff = prompt('工作人員姓名：') || '未填';
  const r = await post({type:'checkin', staff:staff, tree_id:id, prj:prj});
  alert(r.ok ? '✅ 簽到成功！' : '❌ 失敗：' + r.error);
}

async function submitInspection(){
  const staff  = prompt('工作人員姓名：') || '未填';
  const f = $('#photo').files[0];
  const b64 = f ? await compress(f) : '';
  const r = await post({type:'inspection', staff:staff, tree_id:id, prj:prj,
    health:$('#health').value, note:$('#note').value, photo_base64:b64});
  alert(r.ok ? '✅ 已上傳！樹木狀態已同步更新' : '❌ 失敗：' + r.error);
  if(r.ok) setTimeout(function(){ location.reload(); }, 1000);
}

async function saveTreeInfo(){
  let lat = TREE.lat, lng = TREE.lng;
  const N = $('#eN').value, E = $('#eE').value;
  if(N && E){
    const w = toWGS(N, E);
    if(!w){ alert('HK80 座標轉換失敗，請檢查 N/E 數值'); return; }
    lat = w.lat.toFixed(6); lng = w.lng.toFixed(6);
  }
  const r = await post({type:'update_tree', tree_id:id, prj:prj,
    name:$('#eName').value, species:$('#eSpecies').value, status:$('#eStatus').value,
    project_id:$('#eProject').value, height:$('#eHeight').value,
    spread:$('#eSpread').value, dbh:$('#eDbh').value, level:$('#eLevel').value,
    lat:lat, lng:lng, description:$('#eDesc').value});
  alert(r.ok ? '✅ 已更新！' : '❌ 失敗：' + r.error);
  if(r.ok) setTimeout(function(){ location.reload(); }, 800);
}

function post(payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)}).then(function(r){ return r.json(); });
}

async function compress(file, maxW, q){
  maxW = maxW || 1200; q = q || .8;
  const img = await createImageBitmap(file);
  const s = Math.min(1, maxW / img.width);
  const c = document.createElement('canvas');
  c.width = img.width * s; c.height = img.height * s;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q).split(',')[1];
}

function loadLogs(){
  fetch(API + '?action=inspections&id=' + encodeURIComponent(id) + '&prj=' + encodeURIComponent(prj))
    .then(function(r){ return r.json(); })
    .then(function(res){
      const data = res.data || [];
      if(!data.length){ $('#logs').innerHTML = '<div class="log">尚無記錄</div>'; return; }
      $('#logs').innerHTML = data.reverse().map(function(r){
        return '<div class="log"><span class="ok">' + r.health + '</span>｜' + r.staff +
               '｜' + fmtTime(r.time) + '<br>' + (r.note||'') +
               (r.photo_url ? '<img class="tree" src="' + r.photo_url + '">' : '') + '</div>';
      }).join('');
    })
    .catch(function(){ $('#logs').innerHTML = '<div class="log">載入失敗</div>'; });
}
</script>
</body>
</html>
