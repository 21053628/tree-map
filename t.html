<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樹木資訊</title>
<script src="https://unpkg.com/proj4@2.9.2/dist/proj4.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       margin:0;background:#f4f7f4;color:#222;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  h1{font-size:20px;margin:8px 0 12px;}
  h2{font-size:16px;margin:20px 0 8px;}
  .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.1);
        line-height:1.7;}
  input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;
        border:1px solid #ccc;border-radius:6px;font-size:15px;}
  textarea{min-height:70px;}
  button{width:100%;padding:12px;margin-top:6px;border:none;border-radius:6px;
        background:#2e7d32;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
  hr{border:none;border-top:1px dashed #ccc;margin:16px 0;}
  .photos img{width:70px;height:70px;object-fit:cover;border-radius:6px;margin:4px 4px 0 0;}
  .ins{border-bottom:1px solid #eee;padding:8px 0;}
  .ins:last-child{border-bottom:none;}
  a{color:#1a73e8;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="treeTitle">🌳 樹木資訊</h1>
  <div id="treeBox" class="card">載入中…</div>

  <h2>📋 巡查記錄</h2>
  <div id="insBox" class="card">載入中…</div>

  <h2>👷 工作人員專區 🔒</h2>
  <div class="card">
    <b>1️⃣ 簽到</b>
    <input id="chkStaff" placeholder="員工姓名">
    <button onclick="doCheckin()">✅ 簽到</button>

    <hr>

    <b>2️⃣ 巡查記錄（可多張相片）</b>
    <input id="insStaff" placeholder="員工姓名">
    <select id="insHealth">
      <option value="">-- 樹木狀況 --</option>
      <option>Normal</option><option>Fair</option><option>Poor</option>
      <option>Very Poor</option><option>Dead</option>
    </select>
    <textarea id="insNote" placeholder="巡查備註（可留空）"></textarea>
    <input type="file" id="insPhotos" accept="image/*" multiple>
    <button onclick="doInspection()">💾 提交巡查</button>
  </div>

  <p><a href="index.html">↩ 返回地圖</a></p>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
  ApiService.init(Config.API_ENDPOINT);

  var params = new URLSearchParams(location.search);
  var TREE_ID = params.get('id') || '';
  var PRJ = params.get('prj') || '';
  var TREE = null;

  function esc(s){
    var d = document.createElement('div');
    d.textContent = (s === null || s === undefined) ? '' : String(s);
    return d.innerHTML;
  }

  function fmtTime(v){
    if(!v) return '';
    var d = new Date(v);
    return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
  }

  async function loadAll(){
    try{
      var res = await Promise.all([
        ApiService.get('tree', { id: TREE_ID, prj: PRJ }),
        ApiService.get('inspections', { id: TREE_ID, prj: PRJ })
      ]);
      TREE = res[0].data || null;
      renderTree();
      renderInspections(res[1].data || []);
    }catch(e){
      document.getElementById('treeBox').innerHTML = '❌ 載入失敗：' + esc(e.message);
    }
  }

  function renderTree(){
    var box = document.getElementById('treeBox');
    if(!TREE){ box.innerHTML = '❌ 找不到樹木'; return; }
    document.getElementById('treeTitle').textContent = '🌳 ' + TREE.tree_id + ' ' + (TREE.name || '');
    var hk = CoordUtils.toHK80(+TREE.lat, +TREE.lng);
    var photos = String(TREE.photo_url || '').split(',').filter(function(u){
      return u && u.indexOf('...') === -1;
    });
    box.innerHTML =
      '<b>Status:</b> ' + esc(TREE.status) + '<br>' +
      '<b>地盤:</b> ' + esc(TREE.project_id || '-') + '<br>' +
      '<b>DBH:</b> ' + esc(TREE.dbh || '-') + ' cm｜<b>Height:</b> ' + esc(TREE.height || '-') +
      ' m｜<b>Spread:</b> ' + esc(TREE.spread || '-') + ' m<br>' +
      (hk ? '<b>HK80:</b> N ' + CoordUtils.format1(hk.N) + ' / E ' + CoordUtils.format1(hk.E) + '<br>' : '') +
      '<b>描述:</b> ' + esc(TREE.description || '-') +
      (photos.length ? '<div class="photos">' + photos.map(function(u){
        return '<img src="' + u + '">';
      }).join('') + '</div>' : '');
  }

  function renderInspections(list){
    var box = document.getElementById('insBox');
    if(!list.length){ box.innerHTML = '暫無巡查記錄。'; return; }
    list.sort(function(a,b){ return new Date(b.time) - new Date(a.time); });
    box.innerHTML = list.map(function(r){
      var photos = String(r.photo_url || '').split(',').filter(function(u){ return u; });
      return '<div class="ins"><b>' + esc(fmtTime(r.time)) + '</b>｜' + esc(r.staff) +
        '｜' + esc(r.health || '') + '<br>' +
        (r.note ? esc(r.note) + '<br>' : '') +
        (photos.length ? '<div class="photos">' + photos.map(function(u){
          return '<img src="' + u + '">';
        }).join('') + '</div>' : '') + '</div>';
    }).join('');
  }

  /* 簽到（要密碼）*/
  async function doCheckin(){
    if(!await AuthService.promptAuth()) return;
    var staff = document.getElementById('chkStaff').value.trim();
    if(!staff){ alert('請輸入員工姓名'); return; }
    var r = await ApiService.post({
      type: 'checkin', staff: staff, tree_id: TREE_ID, prj: PRJ,
      lat: TREE ? TREE.lat : '', lng: TREE ? TREE.lng : ''
    });
    alert(r.ok ? '✅ 簽到成功！' : '❌ ' + r.error);
  }

  /* 巡查（要密碼）*/
  async function doInspection(){
    if(!await AuthService.promptAuth()) return;
    var staff = document.getElementById('insStaff').value.trim();
    if(!staff){ alert('請輸入員工姓名'); return; }
    var health = document.getElementById('insHealth').value;
    var note = document.getElementById('insNote').value.trim();
    var files = Array.from(document.getElementById('insPhotos').files || []);
    if(!health && !note && !files.length){ alert('請填寫巡查資料或上載相片'); return; }

    try{
      var bases = [];
      for(var i = 0; i < files.length; i++){
        bases.push(await fileToBase64(files[i]));
      }
      var r = await ApiService.post({
        type: 'inspection', staff: staff, tree_id: TREE_ID, prj: PRJ,
        health: health, note: note, photo_base64: bases,
        lat: TREE ? TREE.lat : '', lng: TREE ? TREE.lng : ''
      });
      if(r.ok){ alert('✅ 巡查已提交！'); loadAll(); }
      else{ alert('❌ ' + r.error); }
    }catch(e){
      alert('❌ 提交失敗：' + e.message);
    }
  }

  /* 相片自動縮細再上傳，避免太大 */
  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var MAX = 1280, w = img.width, h = img.height;
          if(w > MAX || h > MAX){
            var ratio = Math.min(MAX / w, MAX / h);
            w = Math.round(w * ratio); h = Math.round(h * ratio);
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  loadAll();
</script>
</body>
</html>
