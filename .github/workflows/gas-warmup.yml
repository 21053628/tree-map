name: GAS Warm-up

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GAS (follow redirects)
        run: |
          curl -sL -o /dev/null -w "最終狀態: HTTP %{http_code}｜耗時 %{time_total}s\n" \
            'https://script.google.com/macros/s/AKfycby5Wby6nj8MPOdw5io10CakB877gY8qf3HKeckPz5MVb-to8QxUYfEH3pN_y-6hHvXj/exec?action=ping' \
            || true
