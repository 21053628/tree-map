name: GAS Warm-up

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GAS (follow redirects)
        run: |
          curl -sL -o /dev/null -w "最終狀態: HTTP %{http_code}｜耗時 %{time_total}s\n" \
            'https://script.google.com/macros/s/AKfycbzNvSomlr1LmAvfA3rByDii9TISFs-HooX2iD5yJkK3QWI59sGhKYpqQyan2HRwgPwC/exec?action=ping' \
            || true
