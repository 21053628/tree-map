<!--
  ⚠️ LEGACY / 未使用：呢個登入頁用 google.script.run.doLogin()，但現時 code.gs 冇 doLogin 函式，
  亦冇用 HtmlService 派發任何頁面。實際登入由前端 assets/js/auth.js 直接 fetch POST {type:'login'} 完成。
  若要重新啟用呢個頁面，需要喺 code.gs 補 doLogin + doGet 派發 HTML。
-->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      padding: 16px;
      box-sizing: border-box;
    }
    .box {
      background: #fff;
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    h2 { margin: 0 0 6px; color: #2e7d32; }
    p { color: #666; font-size: 14px; margin: 0 0 18px; }
    .password-wrapper { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 44px 12px 12px;  /* 右側留空間給眼睛按鈕 */
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #2e7d32; }
    button {
      width: 100%;
      padding: 12px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled { background: #999; cursor: not-allowed; }
    .toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      color: #666;
    }
    .err {
      color: #d93025;
      font-size: 14px;
      margin-top: 10px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🌳 樹木巡查系統</h2>
    <p>請輸入密碼</p>
    <div class="password-wrapper">
      <input type="password" id="pw" placeholder="密碼" autocomplete="current-password" aria-label="密碼">
      <button type="button" id="togglePw" class="toggle-pw" aria-label="顯示密碼">👁</button>
    </div>
    <button id="btn">進入</button>
    <div id="err" class="err" role="alert"></div>
  </div>
  <script>
    const pwInput = document.getElementById('pw');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    const toggleBtn = document.getElementById('togglePw');

    let isSubmitting = false;

    function showError(msg) {
      err.textContent = msg;
      err.style.display = 'block';
    }
    function clearError() {
      err.style.display = 'none';
    }

    async function login() {
      if (isSubmitting) return;
      const pw = pwInput.value.trim();
      if (!pw) {
        showError('請輸入密碼');
        pwInput.focus();
        return;
      }

      isSubmitting = true;
      btn.disabled = true;
      btn.textContent = '驗證中...';
      clearError();

      try {
        const res = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .doLogin(pw);
        });

        if (res.ok) {
          // 🔐 將 token 存到 sessionStorage，避免暴露在 URL
          sessionStorage.setItem('auth_token', res.token);
          // 導向主頁面，不需帶 token 參數
          window.top.location.href = '?action=page';
        } else {
          showError(res.message || '密碼錯誤');
        }
      } catch (e) {
        showError('系統錯誤，請再試');
      } finally {
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = '進入';
      }
    }

    btn.addEventListener('click', login);

    pwInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    toggleBtn.addEventListener('click', () => {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      toggleBtn.textContent = isPassword ? '🙈' : '👁';
      toggleBtn.setAttribute('aria-label', isPassword ? '隱藏密碼' : '顯示密碼');
    });

    // 自動聚焦
    pwInput.focus();
  </script>
</body>
</html>
