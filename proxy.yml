name: Deploy Proxy Data

on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分鐘更新一次數據 (可調整)
  workflow_dispatch: # 允許手動觸發
  push:
    paths:
      - '.github/workflows/proxy.yml'

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch data from Google Apps Script
        run: |
          curl -s "${{ secrets.GAS_URL }}?action=trees" > public/data/trees.json
        env:
          GAS_URL: ${{ secrets.GAS_URL }}

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/trees.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trees data" && git push)
        continue-on-error: true