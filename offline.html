<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>離線中 - 樹木管理 GIS</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/utilities.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;margin:0;padding:16px}
  .offline-card{max-width:480px;width:100%;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:32px;text-align:center}
  .offline-card h1{font-size:1.6rem;color:#2e7d32;margin:0 0 12px}
  .offline-card p{color:#555;line-height:1.6}
  .offline-card .actions{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .offline-card button{padding:10px 20px;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
  .btn-primary{background:#2e7d32;color:#fff}
  .btn-sec{background:#e8f5e9;color:#2e7d32}
  .pending{margin-top:16px;font-size:.9rem;color:#777}
</style>
</head>
<body>
<div class="offline-card">
  <h1>📴 離線中</h1>
  <p>網絡暫時無法連線。你仍可查看已快取的樹木資料，巡查記錄會暫存，恢復連線後自動同步。</p>
  <div class="actions">
    <button class="btn-primary" onclick="location.reload()">🔄 重試</button>
    <button class="btn-sec" onclick="location.href='./index.html'">🏠 返回首頁</button>
  </div>
  <div class="pending" id="pendingInfo"></div>
</div>
<script>
(function(){
  try{
    var count=0;
    // 嘗試讀 IndexedDB pending 數（不阻塞）
    var req=indexedDB.open('tree-offline',3);
    req.onsuccess=function(e){
      try{
        var db=e.target.result;
        if(!db.objectStoreNames.contains('outbox')) return;
        var tx=db.transaction('outbox','readonly');
        var store=tx.objectStore('outbox');
        var all=store.getAll();
        all.onsuccess=function(){
          var list=all.result||[];
          var pending=list.filter(function(r){return r.status==='queued'||r.status==='syncing';}).length;
          var failed=list.filter(function(r){return r.status==='failed';}).length;
          var el=document.getElementById('pendingInfo');
          if(pending||failed) el.textContent='待同步：'+pending+' 筆'+(failed?'（失敗 '+failed+' 筆可重試）':'');
        };
      }catch(_e){}
    };
  }catch(_e){}
})();
</script>
</body>
</html>
