<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; connect-src 'self' https:; font-src 'self' https: data:;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="樹木GIS">
<meta name="theme-color" content="#2e7d32">
<title>Tree Management GIS</title>

<!-- 🔥 PWA Manifest & Icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">

<!-- 🔥 [Tier1-B] LCP 預連線：只保留真正用嘅兩個目標（刪走 jsdelivr） -->
<link rel="preconnect" href="https://mapapi.geodata.gov.hk" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>

<!-- 🔥 [Tier1-B] 自托管樣式（零 CDN 依賴，同域快取） -->
<link rel="stylesheet" href="assets/vendor/leaflet.css">
<link rel="stylesheet" href="assets/vendor/MarkerCluster.css">
<link rel="stylesheet" href="assets/vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div id="bar">
  <select id="projSel"></select>
  <button class="blue" id="addProjectBtn">＋ 建立地盤</button>
  <button id="addTreeBtn" class="ghost-hidden">🌳 新增樹木</button>
  
  <!-- 🔥 樹木搜尋框（只搜尋當前地盤） -->
  <div class="search-wrap">
    <input type="text" id="treeSearch" placeholder="🔍 搜尋當前地盤樹木（編號/樹種）..." autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<div id="panel"><div id="panelContent"></div></div>
<div id="status">🗺️ 載入中…</div>
<div id="map"></div>

<!-- 1️⃣ 自家全域腳本（即時執行，掛去全域詞法環境） -->
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="offline.js"></script>

<!-- 2️⃣ [Tier1-B] 自托管第三方函式庫（同域、即時執行、唔使 fallback） -->
<script src="assets/vendor/leaflet.js"></script>
<script src="assets/vendor/leaflet.markercluster.js"></script>
<script src="assets/vendor/proj4.js"></script>
<script src="assets/vendor/purify.min.js"></script>

<!-- 3️⃣ 主入口（ES Module，最後執行） -->
<script type="module" src="assets/js/app.js"></script>

<!-- 🔥 PWA Service Worker 註冊 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
