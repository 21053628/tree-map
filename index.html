<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樹木互動地圖</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif}
  #map{height:100%}
  #bar{position:absolute;top:8px;left:8px;right:8px;z-index:999;display:flex;gap:6px;flex-wrap:wrap}
  #bar select{padding:8px;border-radius:8px;border:1px solid #bbb;font-size:14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:50%}
  #bar button{padding:8px 10px;border-radius:8px;border:none;font-size:14px;background:#2e7d32;color:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  #bar button.blue{background:#1565c0}
  #status{position:absolute;bottom:24px;left:8px;z-index:999;background:#fff;padding:6px 12px;border-radius:8px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:85%}
  .popup-img{width:160px;border-radius:6px;margin:4px 0}
  .legend{background:#fff;padding:8px 12px;border-radius:8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.7}
  .prjIcon{background:#1565c0;color:#fff;border-radius:6px;padding:2px 6px;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="bar">
  <select id="projSel" onchange="selectProject(this.value)"></select>
  <button class="blue" onclick="createProject()">＋ 建立工程</button>
  <button onclick="addTree()">🌳 新增樹木</button>
</div>
<div id="status">🗺️ 載入中…</div>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycby5Wby6nj8MPOdw5io10CakB877gY8qf3HKeckPz5MVb-to8QxUYfEH3pN_y-6hHvXj/exec';
const STAFF_PASS = 'tree2026';
const statusEl = document.getElementById('status');

let myLat=null, myLng=null;
navigator.geolocation.getCurrentPosition(p=>{myLat=p.coords.latitude;myLng=p.coords.longitude;},()=>{},{enableHighAccuracy:true,timeout:8000});

let PROJECTS=[], TREES=[], curProject='';
const map = L.map('map').setView([22.5,114.1], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);
const treeLayer = L.layerGroup().addTo(map);
const prjLayer  = L.layerGroup().addTo(map);
const COLORS = {'Normal':'#2e7d32','Fair':'#f9a825','Poor':'#ef6c00','Very Poor':'#c62828'};

const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const d = L.DomUtil.create('div','legend');
  d.innerHTML = '<b>🚩 工程｜● Tree Status</b><br><span style="color:#2e7d32">●</span> Normal '+
    '<span style="color:#f9a825">●</span> Fair <span style="color:#ef6c00">●</span> Poor '+
    '<span style="color:#c62828">●</span> Very Poor';
  return d;
};
legend.addTo(map);

load();
function load(){
  Promise.all([
    fetch(API+'?action=projects').then(r=>r.json()),
    fetch(API+'?action=trees').then(r=>r.json())
  ]).then(function(res){
    PROJECTS = res[0].data || [];
    TREES = res[1].data || [];
    buildSelect(); drawProjects(); drawTrees();
  }).catch(function(err){ statusEl.textContent = '❌ 後端連線失敗：' + err.message; });
}

function buildSelect(){
  const sel = document.getElementById('projSel');
  sel.innerHTML = '<option value="">🗂️ 全部工程</option>' +
    PROJECTS.map(p=>'<option value="'+p.project_id+'">🚩 '+p.name+'</option>').join('');
  sel.value = curProject;
}

function drawProjects(){
  prjLayer.clearLayers();
  PROJECTS.forEach(function(p){
    const lat=+p.lat, lng=+p.lng;
    if(!lat||!lng) return;
    const count = TREES.filter(t=>String(t.project_id)===String(p.project_id)).length;
    L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="prjIcon">🚩</div>',iconSize:[34,24],iconAnchor:[17,12]})})
      .addTo(prjLayer)
      .bindPopup('<b>🚩 '+p.name+'</b><br>此工程樹木：'+count+' 棵<br>'+
        '<button onclick="selectProject(\''+p.project_id+'\')">📍 前往工地查看樹木</button>');
  });
}

function selectProject(pid){
  curProject = pid;
  document.getElementById('projSel').value = pid;
  if(pid){
    const p = PROJECTS.find(x=>String(x.project_id)===String(pid));
    if(p) map.flyTo([+p.lat, +p.lng], 17);
  }
  drawTrees();
}

function drawTrees(){
  treeLayer.clearLayers();
  const list = curProject ? TREES.filter(t=>String(t.project_id)===String(curProject)) : TREES;
  list.forEach(function(t){
    const lat=+t.lat, lng=+t.lng;
    if(!lat||!lng) return;
    L.circleMarker([lat,lng],{color:'#fff',weight:2,radius:9,
      fillColor:COLORS[t.status]||'#757575',fillOpacity:.9})
    .addTo(treeLayer).bindPopup(
      '<b>'+t.tree_id+' '+t.name+'</b><br><i>'+t.species+'</i><br>'+
      '<b>Status:</b> '+t.status+'<br>'+
      '<b>DBH:</b> '+(t.dbh||'-')+' cm | <b>Height:</b> '+(t.height||'-')+' m<br>'+
      '<b>Spread:</b> '+(t.spread||'-')+' m<br>'+
      ((t.photo_url && String(t.photo_url).indexOf('...')===-1) ? '<img class="popup-img" src="'+t.photo_url+'"><br>' : '')+
      '<a href="t.html?id='+encodeURIComponent(t.tree_id)+'">📋 樹木頁（巡查／簽到）</a>');
  });
  const pname = curProject ? (PROJECTS.find(x=>String(x.project_id)===String(curProject))||{}).name : '全部';
  statusEl.textContent = '✅ 工程：' + pname + '｜顯示 ' + list.length + ' 棵樹';
}

/* ＋ 建立工程 */
function createProject(){
  if(prompt('請輸入工作人員密碼：') !== STAFF_PASS){ alert('密碼錯誤'); return; }
  const name = prompt('工程名稱（例如：Naichung 泥涌）：');
  if(!name) return;
  let lat, lng;
  if(confirm('使用目前手機 GPS 作為工地位置？')){ lat=myLat; lng=myLng; }
  if(!lat){ lat = prompt('Latitude（緯度）：'); lng = prompt('Longitude（經度）：'); }
  if(!lat || !lng){ alert('沒有位置資訊'); return; }
  post({type:'create_project', name:name, lat:lat, lng:lng}).then(function(r){
    alert(r.ok ? '✅ 工程已建立！' : '❌ ' + r.error);
    if(r.ok) load();
  });
}

/* 🌳 新增樹木（需先選工程） */
function addTree(){
  if(!curProject){ alert('請先選擇一個工程'); return; }
  if(prompt('請輸入工作人員密碼：') !== STAFF_PASS){ alert('密碼錯誤'); return; }
  const tid = prompt('樹木編號（留空自動產生）：') || '';
  let lat=myLat, lng=myLng;
  if(!lat){ lat = prompt('Latitude（緯度）：'); lng = prompt('Longitude（經度）：'); }
  if(!lat || !lng){ alert('沒有位置資訊'); return; }
  post({type:'create_tree', tree_id:tid, project_id:curProject, lat:lat, lng:lng}).then(function(r){
    if(r.ok){
      if(confirm('✅ 新樹 ' + r.tree_id + ' 已建立。現在開樹木頁補詳細資料？'))
        location.href = 't.html?id=' + encodeURIComponent(r.tree_id);
      load();
    } else alert('❌ ' + r.error);
  });
}

function post(payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)}).then(r=>r.json());
}
</script>
</body>
</html>
