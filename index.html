<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; connect-src 'self' https:; font-src 'self' https: data:;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="樹木GIS">
<meta name="theme-color" content="#2e7d32">
<title>Tree Management GIS</title>

<!-- 🔥 PWA Manifest & Icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">

<!-- 🔥 LCP 優化：關鍵資源預連線 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://mapapi.geodata.gov.hk" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css';">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css';">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div id="bar">
  <select id="projSel"></select>
  <button class="blue" id="addProjectBtn">＋ 建立地盤</button>
  <button id="addTreeBtn" class="ghost-hidden">🌳 新增樹木</button>
  
  <!-- 🔥 樹木搜尋框（只搜尋當前地盤） -->
  <div class="search-wrap">
    <input type="text" id="treeSearch" placeholder="🔍 搜尋當前地盤樹木（編號/樹種）..." autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<div id="panel"><div id="panelContent"></div></div>
<div id="status">🗺️ 載入中…</div>
<div id="map"></div>

<!-- 1️⃣ 自家全域腳本（即時執行，掛去全域詞法環境） -->
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="offline.js"></script>

<!-- 2️⃣ 第三方函式庫（defer + onerror 備援，依順序執行、唔再阻塞解析） -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer
        onerror="this.onerror=null;this.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.min.js" defer
        onerror="this.onerror=null;this.src='https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js" defer
        onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer
        onerror="this.onerror=null;this.src='https://unpkg.com/dompurify@3.0.6/dist/purify.min.js'"></script>

<!-- 3️⃣ 主入口（ES Module，最後執行） -->
<script type="module" src="assets/js/app.js"></script>

<!-- 🔥 PWA Service Worker 註冊 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
