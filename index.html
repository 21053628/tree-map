<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; connect-src 'self' https:; font-src 'self' https: data:;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="樹木GIS">
<meta name="theme-color" content="#2e7d32">
<title>樹木管理 GIS</title>

<!-- 🔥 PWA Manifest & Icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- LCP 預連線 -->
<link rel="preconnect" href="https://mapapi.geodata.gov.hk" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>

<!-- 自托管樣式 -->
<link rel="stylesheet" href="assets/vendor/leaflet.css">
<link rel="stylesheet" href="assets/vendor/MarkerCluster.css">
<link rel="stylesheet" href="assets/vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="assets/css/main.css">

<!-- Modulepreload 極速 -->
<link rel="modulepreload" href="assets/js/app.js">
<link rel="modulepreload" href="assets/js/modules/state.js">
<link rel="modulepreload" href="assets/js/modules/ui-state.js">
<link rel="modulepreload" href="assets/js/modules/dom.js">
<link rel="modulepreload" href="assets/js/modules/map.js">
<link rel="modulepreload" href="assets/js/modules/search.js">
<link rel="modulepreload" href="assets/js/modules/species.js">
<link rel="modulepreload" href="assets/js/modules/trees.js">
<link rel="modulepreload" href="assets/js/modules/filters.js">
<link rel="modulepreload" href="assets/js/modules/projects.js">
<link rel="modulepreload" href="assets/js/modules/locate.js">
<link rel="modulepreload" href="assets/js/modules/lots.js">
<link rel="modulepreload" href="assets/js/modules/forms.js">
<link rel="modulepreload" href="assets/js/modules/draw.js">
<link rel="modulepreload" href="assets/js/modules/geolocate.js">
<link rel="modulepreload" href="assets/js/modules/loader.js">
</head>
<body>
<div id="bar">
  <select id="projSel"></select>
  <button class="blue" id="addProjectBtn">＋ 建立地盤</button>
  <button id="addTreeBtn" class="ghost-hidden">🌳 新增樹木</button>

  <!-- 🔥 樹木搜尋框 -->
  <div class="search-wrap">
    <input type="text" id="treeSearch" placeholder="🔍 搜尋當前地盤樹木（編號/樹種）..." autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>

  <!-- 🔥 桌面過濾（圖層）掣：放喺搜尋框下面 -->
  <button id="filterBtn" class="filter-btn" type="button" title="過濾樹木狀態">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
    <span>篩選</span>
  </button>
</div>

<div id="panel"><div id="panelContent"></div></div>
<div id="status">🗺️ 載入中…</div>
<div id="map"></div>

<!-- 1️⃣ 自家全域腳本（defer：唔阻塞 HTML 首屏解析，仍按順序執行） -->
<script defer src="assets/js/config.js"></script>
<script defer src="assets/js/utils.js"></script>
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/auth.js"></script>
<script defer src="offline.js"></script>

<!-- 2️⃣ 自托管第三方函式庫（defer） -->
<script defer src="assets/vendor/leaflet.js"></script>
<script defer src="assets/vendor/leaflet.markercluster.js"></script>
<script defer src="assets/vendor/proj4.js"></script>
<script defer src="assets/vendor/purify.min.js"></script>

<!-- 3️⃣ 主入口（module 本身即 defer） -->
<script type="module" src="assets/js/app.js"></script>

<!-- 🔥 PWA Service Worker 註冊 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
