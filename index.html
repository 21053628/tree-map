<div id="bar">
  <select id="projSel" aria-label="選擇地盤"></select>

  <!-- 🔥 樹木搜尋框 -->
  <div class="search-wrap">
    <input type="search" id="treeSearch" placeholder="🔍 搜尋當前地盤樹木（編號/樹種）..." autocomplete="off" aria-label="搜尋當前地盤樹木" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list">
    <div id="searchResults" class="search-results" role="listbox" aria-label="搜尋結果" aria-live="polite"></div>
  </div>

  <div class="primary-actions" aria-label="主要操作">
    <button class="blue" id="addProjectBtn" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg> 建立地盤</button>
    <button id="addTreeBtn" class="ghost-hidden" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-tree"></use></svg> 新增樹木</button>
  </div>

  <!-- 🔥 桌面過濾（圖層）按鈕：放在搜尋框下方 -->
  <button id="filterBtn" class="filter-btn" type="button" title="過濾樹木狀態" aria-label="過濾樹木狀態">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7-1.63 1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7-1.63 1.27L12 16z"/></svg>
    <span>篩選</span>
  </button>
</div>
