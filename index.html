<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樹木互動地圖</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif}
  #map{height:100%}
  #bar{position:absolute;top:8px;right:8px;z-index:999;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #bar select{padding:8px;border-radius:8px;border:1px solid #bbb;font-size:14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:46vw}
  #bar button{padding:8px 10px;border-radius:8px;border:none;font-size:14px;background:#2e7d32;color:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  #bar button.blue{background:#1565c0}
  #panel{display:none;position:absolute;top:52px;right:8px;z-index:1000;background:#fff;border-radius:12px;
         padding:12px;width:270px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-height:80vh;overflow:auto}
  #panel input,#panel select{width:100%;padding:8px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:14px;box-sizing:border-box}
  #panel button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px;background:#2e7d32;color:#fff;font-size:15px;cursor:pointer}
  #panel .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #panel .x{background:#90a4ae}
  #status{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;background:#fff;
          padding:6px 12px;border-radius:8px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:85%;white-space:nowrap}
  .popup-img{width:160px;border-radius:6px;margin:4px 0}
  .legend{background:#fff;padding:8px 12px;border-radius:8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.7}
  .prjIcon{background:#1565c0;color:#fff;border-radius:6px;padding:2px 6px;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  /* 樹木編號標記 */
  .treeIcon{display:flex;flex-direction:column;align-items:center}
  .treeIcon .lbl{background:#263238;color:#ffd54f;font-weight:bold;font-size:11px;padding:2px 8px;
                 border-radius:10px;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);margin-bottom:2px;white-space:nowrap}
  .treeIcon .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  /* 圖層切換列 */
  .layerbar{background:#fff;border-radius:10px;padding:4px;display:flex;gap:4px;box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .layerbar button{border:none;background:#eceff1;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  .layerbar button.on{background:#4527a0;color:#fff}
</style>
</head>
<body>
<div id="bar">
  <select id="projSel" onchange="selectProject(this.value)"></select>
  <button class="blue" onclick="openProjectForm()">＋ 建立工程</button>
  <button id="addTreeBtn" style="display:none" onclick="openTreeForm()">🌳 新增樹木</button>
</div>
<div id="panel"><div id="panelContent"></div></div>
<div id="status">🗺️ 載入中…</div>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycby5Wby6nj8MPOdw5io10CakB877gY8qf3HKeckPz5MVb-to8QxUYfEH3pN_y-6hHvXj/exec';
const STAFF_PASS = 'tree2026';
const statusEl = document.getElementById('status');
const $ = function(s){ return document.querySelector(s); };

function staffOk(){
  const until = +localStorage.getItem('tree_staff_until') || 0;
  if(Date.now() < until) return true;
  const p = prompt('請輸入工作人員密碼：');
  if(p === STAFF_PASS){
    localStorage.setItem('tree_staff_until', Date.now() + 30*60*1000);
    return true;
  }
  alert('密碼錯誤'); return false;
}

let PROJECTS=[], TREES=[], curProject='';
const map = L.map('map').setView([22.5,114.1], 11);

/* ---------- 免費圖層：衛星／地形／街道 ---------- */
const baseLayers = {
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
       {attribution:'© Esri World Imagery', maxZoom:19}),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
       {attribution:'© OpenTopoMap (CC-BY-SA)', maxZoom:17}),
  street: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
       {attribution:'© OpenStreetMap', maxZoom:19})
};
baseLayers.sat.addTo(map);   // 預設衛星

const layerBar = L.control({position:'bottomleft'});
layerBar.onAdd = function(){
  const div = L.DomUtil.create('div','layerbar');
  div.innerHTML = '<button data-l="sat" class="on">衛星</button>' +
                  '<button data-l="topo">地形</button>' +
                  '<button data-l="street">街道</button>';
  L.DomEvent.disableClickPropagation(div);
  div.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){
      Object.keys(baseLayers).forEach(k=>map.removeLayer(baseLayers[k]));
      baseLayers[b.dataset.l].addTo(map);
      div.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    };
  });
  return div;
};
layerBar.addTo(map);

const treeLayer = L.layerGroup().addTo(map);
const prjLayer  = L.layerGroup().addTo(map);
const COLORS = {'Normal':'#2e7d32','Fair':'#f9a825','Poor':'#ef6c00','Very Poor':'#c62828'};

const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const d = L.DomUtil.create('div','legend');
  d.innerHTML = '<b>🚩 工程｜● Tree Status</b><br><span style="color:#2e7d32">●</span> Normal '+
    '<span style="color:#f9a825">●</span> Fair <span style="color:#ef6c00">●</span> Poor '+
    '<span style="color:#c62828">●</span> Very Poor';
  return d;
};
legend.addTo(map);

load();
function load(){
  Promise.all([
    fetch(API+'?action=projects').then(r=>r.json()),
    fetch(API+'?action=trees').then(r=>r.json())
  ]).then(function(res){
    PROJECTS = res[0].data || [];
    TREES = res[1].data || [];
    buildSelect(); drawProjects(); drawTrees();
  }).catch(function(err){ statusEl.textContent = '❌ 後端連線失敗：' + err.message; });
}

function buildSelect(){
  const sel = $('#projSel');
  sel.innerHTML = '<option value="">🗂️ 全部工程</option>' +
    PROJECTS.map(p=>'<option value="'+p.project_id+'">🚩 '+p.name+'</option>').join('');
  sel.value = curProject;
  $('#addTreeBtn').style.display = curProject ? 'inline-block' : 'none';
}

function drawProjects(){
  prjLayer.clearLayers();
  PROJECTS.forEach(function(p){
    if(String(p.project_id) === String(curProject)) return;  // 到工地後旗標隱藏
    const lat=+p.lat, lng=+p.lng;
    if(!lat||!lng) return;
    const count = TREES.filter(t=>String(t.project_id)===String(p.project_id)).length;
    L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="prjIcon">🚩</div>',iconSize:[34,24],iconAnchor:[17,12]})})
      .addTo(prjLayer)
      .bindPopup('<b>🚩 '+p.name+'</b><br>此工程樹木：'+count+' 棵<br>'+
        '<button onclick="selectProject(\''+p.project_id+'\')">📍 前往工地查看樹木</button>');
  });
}

function selectProject(pid){
  curProject = pid;
  map.closePopup();
  buildSelect();
  if(pid){
    const p = PROJECTS.find(x=>String(x.project_id)===String(pid));
    if(p) map.flyTo([+p.lat, +p.lng], 18);
  }
  drawProjects(); drawTrees();
}

/* ---------- 樹木標記：顯示樹木編號 ---------- */
function drawTrees(){
  treeLayer.clearLayers();
  const list = curProject ? TREES.filter(t=>String(t.project_id)===String(curProject)) : TREES;
  list.forEach(function(t){
    const lat=+t.lat, lng=+t.lng;
    if(!lat||!lng) return;
    const color = COLORS[t.status] || '#757575';
    const html = '<div class="treeIcon"><span class="lbl">' + t.tree_id +
                 '</span><span class="dot" style="background:' + color + '"></span></div>';
    L.marker([lat,lng],{icon:L.divIcon({className:'', html:html,
      iconSize:[70,42], iconAnchor:[35,40], popupAnchor:[0,-34])})
    .addTo(treeLayer).bindPopup(
      '<b>'+t.tree_id+' '+t.name+'</b><br><i>'+t.species+'</i><br>'+
      '<b>Status:</b> '+t.status+'<br>'+
      '<b>DBH:</b> '+(t.dbh||'-')+' cm | <b>Height:</b> '+(t.height||'-')+' m<br>'+
      '<b>Spread:</b> '+(t.spread||'-')+' m<br>'+
      ((t.photo_url && String(t.photo_url).indexOf('...')===-1) ? '<img class="popup-img" src="'+t.photo_url+'"><br>' : '')+
      '<a href="t.html?id='+encodeURIComponent(t.tree_id)+'">📋 樹木頁（巡查／簽到）</a>');
  });
  const pname = curProject ? (PROJECTS.find(x=>String(x.project_id)===String(curProject))||{}).name : '全部';
  statusEl.textContent = '✅ 工程：' + pname + '｜顯示 ' + list.length + ' 棵樹';
}

/* ---------- 面板表單 ---------- */
function showPanel(html){ $('#panelContent').innerHTML = html; $('#panel').style.display='block'; }
function closePanel(){ $('#panel').style.display='none'; }

function openProjectForm(){
  if(!staffOk()) return;
  showPanel(
    '<b>＋ 建立工程</b>' +
    '<input id="pName" placeholder="工程名稱（e.g. Naichung 泥涌）">' +
    '<input id="pLat" placeholder="Latitude（緯度）">' +
    '<input id="pLng" placeholder="Longitude（經度）">' +
    '<button onclick="doCreateProject()">💾 建立</button>' +
    '<button class="x" onclick="closePanel()">✖ 關閉</button>');
}
function doCreateProject(){
  const name=$('#pName').value, lat=$('#pLat').value, lng=$('#pLng').value;
  if(!name||!lat||!lng){ alert('請填寫完整'); return; }
  post({type:'create_project', name:name, lat:lat, lng:lng}).then(function(r){
    alert(r.ok ? '✅ 工程已建立！' : '❌ ' + r.error);
    if(r.ok){ closePanel(); load(); }
  });
}

function openTreeForm(){
  if(!curProject){ alert('請先選擇工程'); return; }
  if(!staffOk()) return;
  showPanel(
    '<b>🌳 新增樹木</b>' +
    '<input id="tId" placeholder="樹木編號（留空自動）">' +
    '<input id="tName" placeholder="名稱">' +
    '<input id="tSpecies" placeholder="樹種">' +
    '<select id="tStatus"><option>Normal</option><option>Fair</option><option>Poor</option><option>Very Poor</option></select>' +
    '<div class="row2"><input id="tHeight" placeholder="Height (m)"><input id="tSpread" placeholder="Spread (m)"></div>' +
    '<input id="tDbh" placeholder="DBH (cm)">' +
    '<input id="tLat" placeholder="Latitude（緯度）">' +
    '<input id="tLng" placeholder="Longitude（經度）">' +
    '<button onclick="doCreateTree()">💾 建立樹木</button>' +
    '<button class="x" onclick="closePanel()">✖ 關閉</button>');
}
function doCreateTree(){
  const lat=$('#tLat').value, lng=$('#tLng').value;
  if(!lat||!lng){ alert('請填寫座標'); return; }
  post({type:'create_tree', tree_id:$('#tId').value, project_id:curProject,
    name:$('#tName').value, species:$('#tSpecies').value, status:$('#tStatus').value,
    height:$('#tHeight').value, spread:$('#tSpread').value, dbh:$('#tDbh').value,
    lat:lat, lng:lng}).then(function(r){
    alert(r.ok ? '✅ 樹木 ' + r.tree_id + ' 已建立' : '❌ ' + r.error);
    if(r.ok){ closePanel(); load(); }
  });
}

function post(payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)}).then(r=>r.json());
}
</script>
</body>
</html>
