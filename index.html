<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樹木互動地圖</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif;
            -webkit-tap-highlight-color:transparent}
  #map{height:100%}
  button{touch-action:manipulation}
  #bar{position:absolute;top:8px;right:8px;z-index:999;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #bar select{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:15px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:46vw}
  #bar button{padding:10px 12px;border-radius:8px;border:none;font-size:15px;background:#2e7d32;color:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  #bar button.blue{background:#1565c0}
  #panel{display:none;position:absolute;top:52px;right:8px;z-index:1200;background:#fff;border-radius:12px;
         padding:12px;width:290px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-height:80vh;overflow:auto}
  #panel input,#panel select{width:100%;padding:10px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:15px;box-sizing:border-box}
  #panel button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;background:#2e7d32;color:#fff;font-size:16px;cursor:pointer}
  #panel .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #panel .x{background:#90a4ae}
  #status{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;background:#fff;
          padding:6px 12px;border-radius:8px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:85%;white-space:nowrap}
  .popup-img{width:160px;border-radius:6px;margin:4px 0}
  .legend{background:#fff;padding:8px 12px;border-radius:8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.7}
  .prjIcon{background:#1565c0;color:#fff;border-radius:6px;padding:2px 6px;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .treeIcon{display:flex;flex-direction:column;align-items:center}
  .treeIcon .lbl{background:#263238;color:#ffd54f;font-weight:bold;font-size:11px;padding:2px 8px;
                 border-radius:10px;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);margin-bottom:2px;white-space:nowrap}
  .treeIcon .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .layerbar{background:#fff;border-radius:10px;padding:4px;display:flex;gap:4px;box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .layerbar button{border:none;background:#eceff1;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  .layerbar button.on{background:#4527a0;color:#fff}
  .leaflet-popup-content{font-size:14px;line-height:1.5}
  .leaflet-popup-content button{padding:8px 12px;font-size:14px;border:none;border-radius:8px;background:#1565c0;color:#fff;cursor:pointer;margin-top:4px}

  /* ================= 手機優化 ================= */
  @media (max-width:600px){
    /* 頂欄單行、不換行 */
    #bar{left:8px;right:8px;flex-wrap:nowrap;gap:4px}
    #bar select{flex:1;min-width:0;max-width:none;font-size:16px;padding:9px 6px}
    #bar button{flex:0 0 auto;padding:10px 10px;font-size:13px;white-space:nowrap}
    /* 縮放鈕移到頂欄下方＋加大觸控 */
    .leaflet-top.leaflet-left{top:60px;left:6px}
    .leaflet-control-zoom a{width:38px;height:38px;line-height:38px;font-size:20px}
    /* 手機隱藏圖例（彈窗內仍有狀態顏色） */
    .legend{display:none}
    /* 開抽屜時隱藏圖層列，避免擋按鈕 */
    body.panel-open .layerbar{display:none}
    /* 底部抽屜＋iPhone 安全區 */
    #panel{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-height:80vh;
           border-radius:16px 16px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
    #panel::before{content:'';display:block;width:44px;height:4px;background:#ccc;border-radius:2px;margin:2px auto 8px}
    #panel input,#panel select{font-size:16px;padding:12px}
    #panel button{padding:14px;font-size:16px}
    #status{font-size:12px;bottom:8px;max-width:92%}
    .layerbar button{padding:10px 14px}
  }
</style>
</head>
<body>
<div id="bar">
  <select id="projSel" onchange="selectProject(this.value)"></select>
  <button class="blue" onclick="openProjectForm()">＋ 建立地盤</button>
  <button id="addTreeBtn" style="display:none" onclick="openTreeForm()">🌳 新增樹木</button>
</div>
<div id="panel"><div id="panelContent"></div></div>
<div id="status">🗺️ 載入中…</div>
<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>if(!window.L){document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');}</script>
<script>if(!window.L){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>');}</script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js"></script>
<script>if(!window.proj4){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"><\/script>');}</script>

<script>
const API = 'https://script.google.com/macros/s/AKfycby5Wby6nj8MPOdw5io10CakB877gY8qf3HKeckPz5MVb-to8QxUYfEH3pN_y-6hHvXj/exec';
const STAFF_PASS = 'tree2026';
const statusEl = document.getElementById('status');
const $ = function(s){ return document.querySelector(s); };
const COLORS = {'Normal':'#2e7d32','Fair':'#f9a825','Poor':'#ef6c00','Very Poor':'#c62828','Dead':'#424242'};

const HK80  = '+proj=tmerc +lat_0=22.31213333333334 +lon_0=114.1785555555556 +k=1 +x_0=836694.05 +y_0=819069.8 +ellps=intl +towgs84=-162.619,-276.959,-161.764,0.067753,-2.243649,-1.158827,-1.094246 +units=m +no_defs';
const WGS84 = '+proj=longlat +datum=WGS84 +no_defs';
function toHK(lat,lng){
  if(!window.proj4 || !lat || !lng) return null;
  try{ const r = proj4(WGS84, HK80, [+lng, +lat]); return {N:r[1], E:r[0]}; }catch(e){ return null; }
}
function toWGS(N,E){
  if(!window.proj4) return null;
  try{ const r = proj4(HK80, WGS84, [+E, +N]); return {lat:r[1], lng:r[0]}; }catch(e){ return null; }
}
function f2(n){ return Number(n).toFixed(1); }   // HK80：小數 1 位

let PROJECTS=[], TREES=[], curProject='';
let map=null, treeLayer=null, prjLayer=null, baseLayers={};

if(window.L){
  map = L.map('map').setView([22.5,114.1], 11);

  const hkBase = L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png',
                 {attribution:'© 地政總署 LandsD HKSAR', maxZoom:19});
  const hkLabel = L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/wgs84/{z}/{x}/{y}.png',
                 {maxZoom:19});
  baseLayers = {
    hk:     L.layerGroup([hkBase, hkLabel]),
    sat:    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              {attribution:'© Esri World Imagery', maxZoom:19}),
    topo:   L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
              {attribution:'© OpenTopoMap (CC-BY-SA)', maxZoom:17}),
    street: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
              {attribution:'© OpenStreetMap', maxZoom:19})
  };
  baseLayers.hk.addTo(map);

  const layerBar = L.control({position:'bottomleft'});
  layerBar.onAdd = function(){
    const div = L.DomUtil.create('div','layerbar');
    div.innerHTML = '<button data-l="hk" class="on">政府</button>' +
                    '<button data-l="sat">衛星</button>' +
                    '<button data-l="topo">地形</button>' +
                    '<button data-l="street">街道</button>';
    L.DomEvent.disableClickPropagation(div);
    div.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        Object.keys(baseLayers).forEach(function(k){ map.removeLayer(baseLayers[k]); });
        baseLayers[b.dataset.l].addTo(map);
        div.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
      };
    });
    return div;
  };
  layerBar.addTo(map);

  treeLayer = L.layerGroup().addTo(map);
  prjLayer  = L.layerGroup().addTo(map);

  const legend = L.control({position:'bottomright'});
  legend.onAdd = function(){
    const d = L.DomUtil.create('div','legend');
    d.innerHTML = '<b>🚩 地盤｜● Tree Status</b><br>' +
      '<span style="color:#2e7d32">●</span> Normal <span style="color:#f9a825">●</span> Fair ' +
      '<span style="color:#ef6c00">●</span> Poor <span style="color:#c62828">●</span> Very Poor ' +
      '<span style="color:#424242">●</span> Dead';
    return d;
  };
  legend.addTo(map);

  load();
}else{
  statusEl.textContent = '❌ 地圖元件載入失敗：請檢查網路後重新整理';
}

function staffOk(){
  const until = +localStorage.getItem('tree_staff_until') || 0;
  if(Date.now() < until) return true;
  const p = prompt('請輸入工作人員密碼：');
  if(p === STAFF_PASS){
    localStorage.setItem('tree_staff_until', Date.now() + 30*60*1000);
    return true;
  }
  alert('密碼錯誤'); return false;
}

function load(){
  Promise.all([
    fetch(API+'?action=projects').then(function(r){ return r.json(); }),
    fetch(API+'?action=trees').then(function(r){ return r.json(); })
  ]).then(function(res){
    PROJECTS = res[0].data || [];
    TREES = res[1].data || [];
    buildSelect(); drawProjects(); drawTrees();
  }).catch(function(err){ statusEl.textContent = '❌ 後端連線失敗：' + err.message; });
}

function buildSelect(){
  const sel = $('#projSel');
  sel.innerHTML = '<option value="">🗂️ 全部地盤</option>' +
    PROJECTS.map(function(p){ return '<option value="'+p.project_id+'">🚩 '+p.name+'</option>'; }).join('');
  sel.value = curProject;
  $('#addTreeBtn').style.display = curProject ? 'inline-block' : 'none';
}

function drawProjects(){
  prjLayer.clearLayers();
  PROJECTS.forEach(function(p){
    if(String(p.project_id) === String(curProject)) return;
    const lat=+p.lat, lng=+p.lng;
    if(!lat||!lng) return;
    const hk = toHK(lat,lng);
    const count = TREES.filter(function(t){ return String(t.project_id)===String(p.project_id); }).length;
    L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="prjIcon">🚩</div>',iconSize:[34,24],iconAnchor:[17,12]})})
      .addTo(prjLayer)
      .bindPopup('<b>🚩 '+p.name+'</b><br>此地盤樹木：'+count+' 棵<br>'+
        (hk ? 'HK80：N '+f2(hk.N)+' / E '+f2(hk.E)+'<br>' : '')+
        '<button onclick="selectProject(\''+p.project_id+'\')">📍 前往地盤查看樹木</button>');
  });
}

function selectProject(pid){
  curProject = pid;
  map.closePopup();
  buildSelect();
  if(pid){
    const p = PROJECTS.find(function(x){ return String(x.project_id)===String(pid); });
    if(p) map.flyTo([+p.lat, +p.lng], 18);
  }
  drawProjects(); drawTrees();
}

function drawTrees(){
  treeLayer.clearLayers();
  if(!curProject){
    statusEl.textContent = '👉 請先選擇地盤，即可查看樹木';
    return;
  }
  const list = TREES.filter(function(t){ return String(t.project_id)===String(curProject); });
  list.forEach(function(t){
    const lat=+t.lat, lng=+t.lng;
    if(!lat||!lng) return;
    const color = COLORS[t.status] || '#757575';
    const hk = toHK(lat,lng);
    const html = '<div class="treeIcon"><span class="lbl">' + t.tree_id +
                 '</span><span class="dot" style="background:' + color + '"></span></div>';
    L.marker([lat,lng],{icon:L.divIcon({className:'', html:html,
      iconSize:[70,42], iconAnchor:[35,40], popupAnchor:[0,-34]})})
    .addTo(treeLayer).bindPopup(
      '<b>'+t.tree_id+' '+t.name+'</b><br><i>'+t.species+'</i><br>'+
      '<b>Status:</b> '+t.status+'<br>'+
      '<b>DBH:</b> '+(t.dbh||'-')+' cm | <b>Height:</b> '+(t.height||'-')+' m<br>'+
      '<b>Spread:</b> '+(t.spread||'-')+' m | <b>Level:</b> '+(t.level||'-')+' m<br>'+
      (hk ? '<b>HK80：</b>N '+f2(hk.N)+' / E '+f2(hk.E)+'<br>' : '')+
      ((t.photo_url && String(t.photo_url).indexOf('...')===-1) ? '<img class="popup-img" src="'+t.photo_url+'"><br>' : '')+
      '<a href="t.html?id='+encodeURIComponent(t.tree_id)+'&prj='+encodeURIComponent(t.project_id||'')+'">📋 樹木頁（巡查／簽到）</a>');
  });
  const pname = (PROJECTS.find(function(x){ return String(x.project_id)===String(curProject); })||{}).name;
  statusEl.textContent = '✅ 地盤：' + pname + '｜顯示 ' + list.length + ' 棵樹';
}

/* ---------- 面板（含手機 body class） ---------- */
function showPanel(html){
  $('#panelContent').innerHTML = html;
  $('#panel').style.display = 'block';
  document.body.classList.add('panel-open');
}
function closePanel(){
  $('#panel').style.display = 'none';
  document.body.classList.remove('panel-open');
}

function openProjectForm(){
  if(!staffOk()) return;
  showPanel(
    '<b>＋ 建立地盤</b>' +
    '<input id="pName" placeholder="地盤名稱（e.g. Naichung 泥涌）">' +
    '<div class="row2"><input id="pN" placeholder="HK80 N" inputmode="decimal"><input id="pE" placeholder="HK80 E" inputmode="decimal"></div>' +
    '<button onclick="doCreateProject()">💾 建立</button>' +
    '<button class="x" onclick="closePanel()">✖ 關閉</button>');
}
function doCreateProject(){
  const name=$('#pName').value, N=$('#pN').value, E=$('#pE').value;
  if(!name||!N||!E){ alert('請填寫完整'); return; }
  const w = toWGS(N,E);
  if(!w){ alert('HK80 座標轉換失敗'); return; }
  post({type:'create_project', name:name, lat:w.lat.toFixed(6), lng:w.lng.toFixed(6)}).then(function(r){
    alert(r.ok ? '✅ 地盤已建立！' : '❌ ' + r.error);
    if(r.ok){ closePanel(); load(); }
  });
}

function openTreeForm(){
  if(!curProject){ alert('請先選擇地盤'); return; }
  if(!staffOk()) return;
  showPanel(
    '<b>🌳 新增樹木</b>' +
    '<input id="tId" placeholder="樹木編號（留空自動）">' +
    '<input id="tName" placeholder="名稱">' +
    '<input id="tSpecies" placeholder="樹種">' +
    '<select id="tStatus"><option>Normal</option><option>Fair</option><option>Poor</option><option>Very Poor</option><option>Dead</option></select>' +
    '<div class="row2"><input id="tHeight" placeholder="Height (m)" inputmode="decimal"><input id="tSpread" placeholder="Spread (m)" inputmode="decimal"></div>' +
    '<input id="tDbh" placeholder="DBH (cm)" inputmode="decimal">' +
    '<div class="row2"><input id="tN" placeholder="HK80 N" inputmode="decimal"><input id="tE" placeholder="HK80 E" inputmode="decimal"></div>' +
    '<input id="tLevel" placeholder="Level (m)" inputmode="decimal">' +
    '<button onclick="doCreateTree()">💾 建立樹木</button>' +
    '<button class="x" onclick="closePanel()">✖ 關閉</button>');
}
function doCreateTree(){
  const N=$('#tN').value, E=$('#tE').value;
  if(!N||!E){ alert('請填寫 HK80 座標 N/E'); return; }
  const w = toWGS(N,E);
  if(!w){ alert('HK80 座標轉換失敗'); return; }
  post({type:'create_tree', tree_id:$('#tId').value, project_id:curProject,
    name:$('#tName').value, species:$('#tSpecies').value, status:$('#tStatus').value,
    height:$('#tHeight').value, spread:$('#tSpread').value, dbh:$('#tDbh').value,
    level:$('#tLevel').value, lat:w.lat.toFixed(6), lng:w.lng.toFixed(6)}).then(function(r){
    alert(r.ok ? '✅ 樹木 ' + r.tree_id + ' 已建立' : '❌ ' + r.error);
    if(r.ok){ closePanel(); load(); }
  });
}

function post(payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)}).then(function(r){ return r.json(); });
}
</script>
</body>
</html>
